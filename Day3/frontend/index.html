<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get And Post requests</title>
</head>
<body>
    <h3>Get Request Form</h3>
    <form method="get" action="http://localhost:3000/register">
        <input placeholder="enter usrname" name="user" type="text">
        <input placeholder="enter password" type="text" name="password">
        <button>Submit</button>
    </form>

    <hr>

    <h3>Post Request Form</h3>
    <form method="post" action="http://localhost:3000/register">
        <input placeholder="enter usrname" name="user" type="text">
        <input placeholder="enter password" type="text" name="password">
        <button>Submit</button>
    </form>
</body>
</html>
